[package]
name = "athena-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Records and judges probe captures from the Workshop Inspector log."

[[bin]]
name = "athena"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true
