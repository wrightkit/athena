[package]
name = "athena-sim"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Scheduler simulator for Overwatch Workshop rules, checked against real-client captures."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workshop-rs = "1.26"

[dev-dependencies]
sha2 = "0.10"
jsonschema = { version = "0.58", default-features = false }

[lints]
workspace = true
