name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy and `cargo test --locked --workspace --all-targets`; the test
  # run includes the probe_sha256 check in crates/athena-sim/tests/probe_hashes.rs.
  rust-quality:
    name: Rust (1.85.0)
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@main
    with:
      toolchain: 1.85.0
      cache-shared-key: linux-ci

  # The simulator core is host-agnostic: a native-only dependency (filesystem,
  # threads, system clock) fails this build for wasm32-unknown-unknown.
  wasm-check:
    name: Core builds for WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.85.0
          targets: wasm32-unknown-unknown
          cache-shared-key: linux-ci
          cache-save: "false"
      - name: Check athena-sim for wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p athena-sim
