name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: Workflow lint
    uses: wrightkit/.github/.github/workflows/actionlint.yml@main
    permissions:
      contents: read

  rust-quality:
    name: Rust (1.88.0)
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@main
    with:
      toolchain: 1.88.0
      cache-shared-key: linux-ci

  wasm-check:
    name: Core builds for WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          cache-shared-key: linux-ci
          cache-save: "false"
      - name: Check athena-sim for wasm32
        run: cargo check --locked --target wasm32-unknown-unknown -p athena-sim
